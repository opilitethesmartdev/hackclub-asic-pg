modules:
  # The following modules need to have specific mux addresses assigned
  - name: 'chip_rom' # ROM module, address 0
    mux_id: 0
    blk_id: 0
  - name: 'factory_test' # Factory test module, address 1
    mux_id: 0
    blk_id: 1
  - name: 'common_sram' # Reserved 4x4 slot for two Arrakeen 256x32 banks
    mux_id: 8
    blk_id: 7
    width: 4
    height: 4
    pg_vdd: false
    pg_vaa: false
    common_sram: true
